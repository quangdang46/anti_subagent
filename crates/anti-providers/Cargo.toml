[package]
name = "anti-providers"
version = "0.1.0"
edition = "2024"

[dependencies]
anti-core = { path = "../anti-core" }
anti-adapters = { path = "../anti-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
