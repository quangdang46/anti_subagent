[package]
name = "anti-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anti-core = { path = "../anti-core" }
anti-workspace = { path = "../anti-workspace" }
anti-adapters = { path = "../anti-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
fd-lock = "4"
thiserror = "2"
libc = "0.2"
sha2 = "0.10"
treehouse-core = { git = "https://github.com/quangdang46/treehouse_rust", rev = "e974d74" }
uuid = { version = "1.24.1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }

[lib]
name = "anti_daemon"
path = "src/lib.rs"

[[bin]]
name = "anti-daemon"
path = "src/main.rs"
